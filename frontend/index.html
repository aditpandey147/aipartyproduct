    <style>
      /* ================================================================
         SCROLLBAR — AI Party (violet on light)
         ================================================================ */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #fbfaff; border-radius: 10px; }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #b944ff 0%, #7620e8 50%, #5b00ce 100%);

        border: 2px solid #fbfaff;

      }

      * { scrollbar-width: thin; scrollbar-color: #7620e8 #fbfaff; }

      html { scroll-behavior: smooth; }

      /* ================================================================
         PAGE BASE + GLOBAL FONTS
         ================================================================ */
      html, body {
        background: #faf9ff;
        color: #151032;
        font-family: 'Inter', sans-serif;
        font-size: 14px; /* ← matches HTML base */
      }

      /* ================================================================
         HEADINGS — Inter (matches HTML, NOT Playfair)
         Sizes match the HTML reference scale
         ================================================================ */
      h1, h2, h3, h4, h5, h6,
      .heading, .heading-1, .heading-2, .heading-3,
      .mm-serif, .mm-heading, .font-heading {
        font-family: 'Inter', -apple-system, sans-serif !important;
      }

      h1 { font-size: 27px; line-height: 32px; font-weight: 800; letter-spacing: -1.1px; }
      h2 { font-size: 22px; line-height: 28px; font-weight: 800; letter-spacing: -0.7px; }
      h3 { font-size: 19px; line-height: 24px; font-weight: 800; letter-spacing: -0.6px; }
      h4 { font-size: 17px; line-height: 22px; font-weight: 700; letter-spacing: -0.4px; }
      h5 { font-size: 15px; line-height: 20px; font-weight: 700; letter-spacing: -0.2px; }
      h6 { font-size: 14px; line-height: 18px; font-weight: 700; }

      /* Body paragraphs stay Inter */
      p, span, a, li, div, label, input, textarea, select, button {
        font-family: inherit;
      }

      /* Gradient text — violet/pink */
      .gradient-text {
        background: linear-gradient(90deg, #ed008e, #db007c);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* Primary gradient — violet */
      .gradient-primary {
        background: linear-gradient(110deg, #d634ef 0%, #8e15e5 50%, #4d00af 100%);
      }

      /* Soft radial glow background */
      .gradient-bg {
        background:
          radial-gradient(ellipse 42% 45% at 7% 12%, #f9f6ff 0%, transparent 100%),
          radial-gradient(ellipse 40% 44% at 72% 45%, #fce7fa 0%, transparent 100%),
          radial-gradient(ellipse 65% 44% at 5% 100%, #e6a3ff 0%, transparent 100%),
          linear-gradient(125deg, #f9efff 5%, #eec8fa 56%, #d79af6 100%);
      }

      /* Loader */
      .loader {
        border: 3px solid rgba(118,32,232,.15);
        border-top: 3px solid #7620e8;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .card-hover { transition: all 0.3s ease; }
      .card-hover:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 25px -5px rgba(118,32,232,.12),
                    0 10px 10px -5px rgba(236,11,137,.06);
      }

      .accent-glow { box-shadow: 0 0 30px rgba(118,32,232,.2); }
      .accent-glow:hover { box-shadow: 0 0 50px rgba(118,32,232,.35); }

      .bg-grid-pattern {
        background-image:
          linear-gradient(rgba(118,32,232,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(118,32,232,0.04) 1px, transparent 1px);
        background-size: 30px 30px;
      }
    </style>
